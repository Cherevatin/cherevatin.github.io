name: Generate CV PDF

on:
  push:
    branches:
      - dev
    paths-ignore:
      - assets/Serhii_Cherevatin_Full_Stack_Engineer.pdf
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Generate PDF from index.html
        run: npm run pdf

      - name: Commit the generated PDF when it changed
        run: |
          if git diff --quiet -- assets/Serhii_Cherevatin_Full_Stack_Engineer.pdf; then
            echo "PDF is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Serhii_Cherevatin_Full_Stack_Engineer.pdf
          git commit -m "chore: regenerate CV PDF [skip ci]"
          git push
